<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collaboration browser</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 12px/1.4 -apple-system, Segoe UI, sans-serif; }
      #bar { display: flex; gap: 6px; align-items: center; padding: 6px; border-bottom: 1px solid #30363d; background: #161b22; }
      #bar button { padding: 5px 10px; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #e6edf3; cursor: pointer; font: inherit; }
      #bar button:hover { background: #30363d; }
      #url { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #e6edf3; font: inherit; }
      #stage { position: fixed; top: 45px; left: 0; right: 0; bottom: 0; }
      #frame { width: 100%; height: 100%; display: block; object-fit: contain; }
      #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #8b949e; display: none; text-align: center; }
      #msg { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); max-width: 90%; padding: 6px 12px; border-radius: 6px; display: none; z-index: 1; }
      #msg.error { background: #3d1d20; border: 1px solid #f85149; color: #ffdcd7; }
      #msg.info { background: #161b22; border: 1px solid #30363d; color: #8b949e; }
      #open:disabled, #pause:disabled { opacity: 0.6; cursor: default; }
      #bar #pause.paused { background: #3b2e0a; border-color: #d29922; color: #f2cc60; }
      #paused-note { position: absolute; bottom: 8px; left: 8px; padding: 4px 10px; border-radius: 6px; background: #3b2e0a; border: 1px solid #d29922; color: #f2cc60; display: none; z-index: 1; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button data-act="back" title="Back">&larr;</button>
      <button data-act="forward" title="Forward">&rarr;</button>
      <button data-act="reload" title="Reload">&#8635;</button>
      <input id="url" type="text" placeholder="https://example.com" spellcheck="false" />
      <button id="open">Open</button>
      <button id="pause" title="Stop the agents from using this browser. You can still browse.">Pause agents</button>
    </div>
    <div id="stage">
      <img id="frame" alt="Collaboration browser" />
      <div id="msg" role="status"></div>
      <div id="status"></div>
      <div id="paused-note">Agents are paused. They can't use this browser until you resume them.</div>
    </div>
    <script>
      (function () {
        function token() { return localStorage.getItem('crab_token') || ''; }
        var img = document.getElementById('frame');
        var status = document.getElementById('status');
        var urlInput = document.getElementById('url');
        var openBtn = document.getElementById('open');
        var msgBox = document.getElementById('msg');
        var pauseBtn = document.getElementById('pause');
        var pausedNote = document.getElementById('paused-note');
        var paused = false;
        var timer = null, lastUrl = null;

        function setStatus(msg) {
          status.style.display = msg ? 'block' : 'none';
          status.textContent = msg || '';
        }

        // Notice over the live frame. It stays until the next action replaces it.
        function showMsg(text, kind) {
          msgBox.className = kind || 'error';
          msgBox.textContent = text || '';
          msgBox.style.display = text ? 'block' : 'none';
        }

        // Turn the bridge's error codes into something a person can act on.
        function explain(detail) {
          var d = String(detail || '');
          if (d.indexOf('LOCAL_PREVIEW_RESERVED') === 0) return 'That port belongs to CrabAgent itself and cannot be opened here.';
          if (d.indexOf('PRIVATE_NETWORK_BLOCKED') === 0) return 'That address is on a private network and is not allowed. To open a local dev server, type its localhost, 127.0.0.1 or [::1] address in the address bar.';
          if (d.indexOf('NAVIGATION_FAILED') === 0) {
            if (/ERR_CONNECTION_REFUSED/.test(d)) return 'Nothing is answering at that address. Is the server running?';
            if (/ERR_NAME_NOT_RESOLVED/.test(d)) return 'That address could not be found.';
            if (/Timeout/i.test(d)) return 'The page did not load within 30 seconds. Is the server running?';
            return 'The page failed to load: ' + d.replace(/^NAVIGATION_FAILED:\s*/, '').split('\n')[0];
          }
          if (d.indexOf('HISTORY_FAILED') === 0) return 'Could not go there: ' + d.replace(/^HISTORY_FAILED:\s*/, '').split('\n')[0];
          return d || 'The browser could not do that.';
        }

        function stop() { if (timer) { clearTimeout(timer); timer = null; } }

        function clearFrame() {
          img.removeAttribute('src');
          if (lastUrl) { URL.revokeObjectURL(lastUrl); lastUrl = null; }
        }

        function poll() {
          fetch('/api/collab-browser/frame', { headers: { Authorization: 'Bearer ' + token() } })
            .then(function (res) {
              if (res.status !== 200) {
                var err = new Error('http ' + res.status);
                err.status = res.status;
                throw err;
              }
              return res.blob().then(function (blob) {
                var url = URL.createObjectURL(blob);
                if (lastUrl) URL.revokeObjectURL(lastUrl);
                lastUrl = url;
                img.src = url;
                setStatus('');
                timer = setTimeout(poll, 400);
              });
            })
            .catch(function (err) {
              if (err && err.status === 502) {
                // Browser is up but busy (a page is loading): keep the last frame.
                timer = setTimeout(poll, 1000);
                return;
              }
              stop();
              clearFrame();
              setStatus('browser unavailable');
              setTimeout(function () { if (!timer) poll(); }, 5000);
            });
        }

        function post(path, body) {
          return fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
            body: JSON.stringify(body)
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (!res.ok) {
                var err = new Error((data && data.detail) || ('http ' + res.status));
                err.status = res.status;
                throw err;
              }
              return data;
            });
          }).then(function (data) {
            var result = (data && data.result) || {};
            if (result.url) urlInput.value = result.url;
            showMsg('');
            setStatus('');
            if (!timer) poll();
          }).catch(function (err) {
            if (!err.status || err.status === 503) {
              // The bridge itself is down: stop the frame and retry later.
              stop();
              showMsg('');
              setStatus('browser unavailable');
              setTimeout(function () { if (!timer) poll(); }, 5000);
              return;
            }
            // The browser is fine; only this request was refused. Keep the frame live.
            showMsg(err.status === 401 ? 'Your session expired. Sign in again.' : explain(err.message));
            if (!timer) poll();
          });
        }

        function navigate() {
          var url = urlInput.value.trim();
          if (!url || openBtn.disabled) return;
          openBtn.disabled = true;
          showMsg('Opening ' + url + '…', 'info');
          post('/api/collab-browser/navigate', { url: url }).then(function () {
            openBtn.disabled = false;
          });
        }

        function showPaused(value) {
          paused = !!value;
          pauseBtn.textContent = paused ? 'Resume agents' : 'Pause agents';
          pauseBtn.classList.toggle('paused', paused);
          pausedNote.style.display = paused ? 'block' : 'none';
        }

        function refreshPaused() {
          fetch('/api/collab-browser/status', { headers: { Authorization: 'Bearer ' + token() } })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) { if (data) showPaused(data.paused); })
            .catch(function () {});
        }

        pauseBtn.addEventListener('click', function () {
          var want = !paused;
          pauseBtn.disabled = true;
          fetch('/api/collab-browser/pause', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token() },
            body: JSON.stringify({ paused: want })
          }).then(function (res) {
            if (!res.ok) throw new Error('http ' + res.status);
            showPaused(want);
            showMsg(want ? 'Agents paused. Local addresses you allowed were cleared; type them again to reopen.' : 'Agents can use the browser again.', 'info');
          }).catch(function () {
            showMsg(want ? 'Could not pause the agents.' : 'Could not resume the agents.');
          }).then(function () { pauseBtn.disabled = false; });
        });

        // Another tab may have paused or resumed; check again when this one is shown.
        document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshPaused(); });

        document.getElementById('open').addEventListener('click', navigate);
        urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') navigate(); });
        Array.prototype.forEach.call(document.querySelectorAll('#bar button[data-act]'), function (btn) {
          btn.addEventListener('click', function () {
            post('/api/collab-browser/action', { action: btn.getAttribute('data-act') });
          });
        });

        if (!token()) {
          setStatus('not signed in');
          return;
        }
        refreshPaused();
        poll();
      })();
    </script>
  </body>
</html>
