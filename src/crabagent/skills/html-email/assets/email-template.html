<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{SUBJECT}}</title>
<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>table, td, h1, p, a { font-family: Arial, Helvetica, sans-serif !important; }</style>
<![endif]-->
<style>
  /* Progressive enhancement only: the email must read correctly without this block. */
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .px { padding-left: 20px !important; padding-right: 20px !important; }
    .h1 { font-size: 26px !important; line-height: 32px !important; }
    .stack { display: block !important; width: 100% !important; }
  }
  @media (prefers-color-scheme: dark) {
    .bg-page { background-color: #18191b !important; }
    .bg-card { background-color: #222326 !important; }
    .text { color: #e9e7e3 !important; }
    .muted { color: #a8a49d !important; }
  }
  [data-ogsc] .text { color: #e9e7e3 !important; }   /* Outlook.com dark mode */
  [data-ogsb] .bg-card { background-color: #222326 !important; }
</style>
</head>
<body class="bg-page" style="margin:0; padding:0; background-color:#eeece8;">
  <!-- Preheader: shown next to the subject in the inbox, hidden in the body. -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#eeece8; opacity:0;">
    {{PREHEADER, about 85 characters}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-page" style="background-color:#eeece8;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" class="container" style="width:600px; max-width:600px;">

          <!-- Header -->
          <tr>
            <td class="px" style="padding:8px 32px 20px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:20px; font-weight:bold; color:#2b2a28;">
              <span class="text" style="color:#2b2a28;">{{BRAND NAME}}</span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td class="bg-card px" style="background-color:#ffffff; border-radius:8px; padding:36px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="h1 text" style="font-family:Georgia, 'Times New Roman', serif; font-size:30px; line-height:36px; color:#1f1e1c; mso-line-height-rule:exactly; padding-bottom:16px;">
                    {{HEADLINE}}
                  </td>
                </tr>
                <tr>
                  <td class="text" style="font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#3a3936; mso-line-height-rule:exactly; padding-bottom:28px;">
                    {{BODY COPY}}
                  </td>
                </tr>
                <tr>
                  <td align="left">
                    <!-- Bulletproof button: VML for Outlook, padded link everywhere else. -->
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="https://example.com/action" style="height:46px; v-text-anchor:middle; width:220px;" arcsize="12%" stroke="f" fillcolor="#0b6e4f">
                      <w:anchorlock/>
                      <center style="color:#ffffff; font-family:Arial, sans-serif; font-size:16px; font-weight:bold;">{{BUTTON LABEL}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td bgcolor="#0b6e4f" style="border-radius:6px; background-color:#0b6e4f;">
                          <a href="https://example.com/action" target="_blank" style="display:inline-block; padding:13px 28px; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:20px; font-weight:bold; color:#ffffff; text-decoration:none; border-radius:6px;">{{BUTTON LABEL}}</a>
                        </td>
                      </tr>
                    </table>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Two columns that stack on phones -->
          <tr>
            <td style="padding-top:16px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="stack" width="292" valign="top" style="width:292px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="bg-card text" style="background-color:#ffffff; border-radius:8px; padding:20px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:20px; color:#3a3936;">{{COLUMN A}}</td>
                      </tr>
                    </table>
                  </td>
                  <td class="stack" width="16" height="16" style="width:16px; font-size:0; line-height:0;">&nbsp;</td>
                  <td class="stack" width="292" valign="top" style="width:292px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="bg-card text" style="background-color:#ffffff; border-radius:8px; padding:20px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:20px; color:#3a3936;">{{COLUMN B}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="px muted" style="padding:24px 32px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px; color:#6d6a64;">
              {{COMPANY NAME}} · {{POSTAL ADDRESS}}<br>
              You received this because {{REASON}}.
              <a href="{{UNSUBSCRIBE URL}}" style="color:#6d6a64; text-decoration:underline;">Unsubscribe</a>
            </td>
          </tr>

        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
